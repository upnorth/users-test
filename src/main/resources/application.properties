# Quarkus HTTP configuration
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# OpenAPI and Swagger UI
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
mp.openapi.extensions.smallrye.info.title=User REST API
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=User REST API service with in-memory storage, OpenAPI support, and Vue3 UI

# Health Checks
quarkus.smallrye-health.root-path=/q/health
