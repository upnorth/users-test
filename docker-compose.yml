services:
  users-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: users-test-api:latest
    container_name: users-test-api
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_HTTP_PORT=8080
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/users_db
      - QUARKUS_DATASOURCE_USERNAME=quarkus
      - QUARKUS_DATASOURCE_PASSWORD=quarkus
      - QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION=drop-and-create
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: users-postgres
    environment:
      - POSTGRES_DB=users_db
      - POSTGRES_USER=quarkus
      - POSTGRES_PASSWORD=quarkus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quarkus -d users_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
